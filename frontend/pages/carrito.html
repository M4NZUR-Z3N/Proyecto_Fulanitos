<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/carrito.css">
    <link rel="icon" type="image/icon" href="/assets/icons/side-b.ico">
</head>

<body>
    <div class="container">
        <div class="d-flex flex-column">
            <h1 class="col-12 d-flex mt-5">Finalizar compra</h1>

            <div class="vinilos-comprar d-flex flex-column flex-md-row col-12 justify-content-center">
                <div class="vinilo d-flex col-8 flex-md-row mb-5 border border-dark overflow-hidden z-3">

                    <img class="col-4 d-none d-md-block img-fluid" src="/assets/images/portadas/vinilo-prueba.jpg"
                        alt="Vinilo Prueba">

                    <div class="col-12 col-md-8 d-flex flex-column justify-content-between p-3 bg-white">

                        <p class=" fs-5 mb-0 fw-bold">Thriller</p>
                        <p class="fs-5 mb-0">Artista: Michael Jackson</p>
                        <p class="fs-5 mb-0">Edición: Estándar</p>
                        <p class="fs-5 mb-0">Precio: $10</p>

                    </div>
                </div>
                <div
                    class="pago  d-flex flex-column align-items-center justify-content-center card-body col-12 col-md-4 ms-3 border border-dark p-3">

                    <h4 class="card-title">Resumen del pedido</h4>
                    <div class="w-100 mt-4 d-flex flex-column">
                        <p class="fs-5 mb-0">Subtotal</p>
                        <p class="fs-5 mb-0">Envio</p>
                        <p class="fs-5 mb-0">Total</p>
                    </div>

                    <div class="metodos-pago w-100">
                        <h4 class="fs-4">Metodos de pago</h4> 
                        <div class="btn d-flex p-3 border border-dark justify-content-between">
                            <label for="metodo-pago">Tarjeta de credito</label>
                            <img class="img-fluid" style="width: 50px;" src="/assets/images/master-card.webp"
                                alt="Mastercard">
                            <input type="radio" name="metodo-pago" id="metodo-pago">
                        </div>

                    </div>
                    <button class="btn btn-dark w-80 mt-4 py-2 fw-bold">PAGAR</button>

                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
                crossorigin="anonymous"></script>
            <script src="/js/carrito.js"></script>
</body>

</html>
