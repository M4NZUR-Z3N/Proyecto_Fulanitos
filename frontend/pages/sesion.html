<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="">
</head>

<body>
    </header>
    <main role="main">
        <div class="container">
            <div class="p-2 text-center">
                <h1 class="display-4">Inicio de sesión</h1>
            </div>
            <div class="row g-5 my-5">
                <div class="col-md-7 col-lg-12">
                    <form class="needs-validation" action="catalogo.html" method="get" novalidate>
                        <div class="row g-3">
                            <div class="col-sm-12">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="" value="" required>
                                <div class="invalid-feedback">
                                    Favor ingresar un correo electrónico válido.
                                </div>
                            </div>

                            <div class="col-sm-12">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="text" class="form-control" id="password" placeholder="" required>
                                <div class="invalid-feedback">
                                    Favor ingresar una contraseña.
                                </div>
                            </div>
                            <div class="p-2 ">
                                <p class="text-start">¿Ha olvidado su contraseña?</p>
                            </div>
                        </div>

                        <hr class="my-4">

                        <button class="w-100 btn btn-primary btn-lg" type="submit">Iniciar sesión</button>
                    </form>
                    <div class="p-3 text-center">
                        <p class="text-center">¿No tiene cuenta?</p>
                        <a href="registro.html">Registrarse</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/form-validation.js"></script>

</body>

</html>
